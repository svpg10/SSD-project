events {}
http {
  limit_req_zone $binary_remote_addr zone=simulations:10m rate=60r/m;
  limit_req_zone $server_name zone=global:1m rate=240r/m;
  server {
    listen 8080;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    location /api/v1/simulations {
      limit_req zone=simulations burst=10 nodelay;
      limit_req zone=global burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api:8000;
    }
    location /api/v1/ { proxy_pass http://api:8000; }
    location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
  }
}
