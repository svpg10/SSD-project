[project]
name = "cvd-studio-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "numpy", "scipy", "pint", "jsonschema", "referencing"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "pip-audit", "bandit"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
