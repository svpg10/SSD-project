name: Verify CVD Studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CVD_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install uv==0.13.1
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts
      - run: mkdir -p work outputs
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - run: uv run bandit -r apps/api/src -q
      - run: uv export --frozen --no-dev --format requirements-txt --no-hashes -o work/runtime-requirements.txt
      - run: uv run pip-audit -r work/runtime-requirements.txt --no-deps --disable-pip --cache-dir work/audit-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-verification-evidence
          path: outputs/
